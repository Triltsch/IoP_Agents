name: iop-agents

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip

  - pip:
      # Week 1 + 2: Mesa simulation
      - mesa[viz]==3.0.3
      - altair==5.2.0
      # SolaraViz needs the Vuetify 2 based widgets: ipyvuetify/ipyvue >= 3 (Vuetify 3)
      # break the controls ("[Vuetify] Could not find injected layout")
      - solara==1.44.0
      - ipyvuetify>=1.9,<3
      - ipyvue>=1.10,<3
      - matplotlib
      - networkx
      # Week 2: OPC UA
      - asyncua
      - nest_asyncio
      - wait-for2==0.3.2
      # Week 3: LangGraph, MCP, LLM
      - langgraph>=0.2
      - langchain-core>=0.2
      - langchain-openai>=0.1
      - mcp>=1.0
      - fastapi
      - uvicorn
      - httpx
      - requests
